<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5efe6" />
<title>诗织里 · 拼豆 · 29×29 · 32 色 · v2.2</title>
<style>
  :root {
    --bg: #f5efe6;
    --card: #fffdf8;
    --card-2: #fff;
    --ink: #3a2e26;
    --ink-2: #6b5a4d;
    --accent: #c46e4d;
    --accent-2: #8c4a32;
    --border: #d8c7b3;
    --ok: #4a8a5e;
    --grid-line: rgba(0,0,0,.10);
    --grid-line-strong: rgba(0,0,0,.28);
    --shadow: 0 2px 8px rgba(80,60,40,.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 顶部 */
  header.topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 20;
    flex-wrap: wrap;
  }
  header.topbar h1 {
    font-size: 16px; font-weight: 600;
    margin: 0; color: var(--accent-2);
    letter-spacing: 0.5px;
  }
  header.topbar h1 small { font-size: 12px; color: var(--ink-2); font-weight: 400; margin-left: 6px; }
  header.topbar .progress {
    display: flex; align-items: center; gap: 10px;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  header.topbar progress {
    width: 200px; height: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-2);
    overflow: hidden;
  }
  header.topbar progress::-webkit-progress-bar { background: var(--card-2); }
  header.topbar progress::-webkit-progress-value { background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .25s; }
  header.topbar progress::-moz-progress-bar { background: linear-gradient(90deg, var(--accent), var(--ok)); }
  header.topbar .prog-text { font-size: 12px; color: var(--ink-2); }
  header.topbar .reset-btn {
    margin-left: 4px; padding: 6px 12px;
    font-size: 12px;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--ink-2);
    border-radius: 6px; cursor: pointer;
    min-height: 36px;
  }
  header.topbar .reset-btn:hover { background: #fff0e8; color: var(--accent-2); }

  /* 左上角浮窗撤销：与侧栏撤销按钮同款 */
  .float-controls {
    position: fixed;
    top: 72px; right: 18px;
    z-index: 15;
    display: flex; gap: 6px;
  }
  .float-btn {
    width: 40px; height: 40px;
    padding: 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: background .15s, border-color .15s, color .15s, transform .08s;
    box-shadow: 0 1px 3px rgba(80,60,40,.04);
  }
  .float-btn:hover:not(:disabled) {
    background: #fff5ea;
    border-color: #e8c9a8;
    color: var(--accent-2);
  }
  .float-btn:active:not(:disabled) { transform: scale(0.94); }
  .float-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  @media (max-width: 980px) {
    .float-controls { top: 64px; right: 10px; }
    .float-btn { width: 36px; height: 36px; font-size: 17px; }
  }

  /* 主布局 */
  main.layout {
    display: grid;
    grid-template-columns: 320px 1fr 320px;
    gap: 16px;
    padding: 16px;
    align-items: start;
  }
  .pane {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .pane h2 {
    margin: 0;
    padding: 10px 14px;
    font-size: 13px; font-weight: 600;
    color: var(--ink-2);
    background: #faf5ed;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pane h2 small { font-weight: 400; color: #9b8a7a; }
  .pane-body { padding: 14px; }

  /* 参考图：tab + 切换 */
  .ref-tabs {
    display: flex; gap: 6px;
    margin-bottom: 12px;
  }
  .ref-tab {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    background: var(--card-2);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--ink-2);
    font-family: inherit;
    min-height: 36px;
  }
  .ref-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ref-pane-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
    cursor: zoom-in;
  }
  .ref-pane-frame img,
  .ref-pane-frame canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
  }
  #target-preview-canvas { image-rendering: pixelated; image-rendering: -moz-crisp-edges; }
  #target-mask-canvas { pointer-events: none; opacity: 0; transition: opacity .2s; }
  #target-mask-canvas.on { opacity: 1; }
  .ref-hint { font-size: 11px; color: #9b8a7a; margin-top: 6px; text-align: center; }

  /* 画布 */
  #board-pane .board-wrap {
    background:
      linear-gradient(45deg, #efe5d4 25%, transparent 25%),
      linear-gradient(-45deg, #efe5d4 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #efe5d4 75%),
      linear-gradient(-45deg, transparent 75%, #efe5d4 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, 10px 0;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: flex; justify-content: center;
  }
  .board-frame {
    width: 100%;
    max-width: 720px;
    aspect-ratio: 1 / 1;
  }
  #board-grid {
    display: grid;
    grid-template-columns: repeat(29, 1fr);
    grid-template-rows: repeat(29, 1fr);
    width: 100%; height: 100%;
    background: #fff;
    box-shadow: inset 0 0 0 1px var(--ink-2);
  }
  .cell {
    border-right: 1px solid var(--grid-line);
    border-bottom: 1px solid var(--grid-line);
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .cell.right-edge { border-right: 1px solid var(--grid-line-strong); }
  .cell.bottom-edge { border-bottom: 1px solid var(--grid-line-strong); }
  .cell .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 55%;
    font-weight: 700;
    color: rgba(0,0,0,.55);
    pointer-events: none;
    opacity: 0;
    line-height: 1;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .cell.show-num .num { opacity: 1; }
  .cell.correct::after {
    content: ""; position: absolute; inset: 0;
    background: rgba(74, 138, 94, 0.18);
    pointer-events: none;
  }
  .cell.wrong::after {
    content: ""; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 2px rgba(196, 110, 77, 0.85);
    pointer-events: none;
  }
  .cell.preview { box-shadow: inset 0 0 0 2px var(--accent); }

  /* 侧栏 */
  .current-color {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: #faf5ed;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .current-color .swatch {
    width: 36px; height: 36px;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,.2);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
    flex-shrink: 0;
  }
  .current-color .info { font-size: 12px; line-height: 1.5; flex: 1; }
  .current-color .info .name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .current-color .info .hex {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--ink-2);
    word-break: break-all;
  }

  .palette-section { margin-bottom: 12px; }
  .palette-section-title { font-size: 11px; color: var(--ink-2); margin-bottom: 6px; letter-spacing: 0.5px; }
  #palette {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .swatch-btn {
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    border: 1.5px solid transparent;
    cursor: pointer;
    position: relative;
    padding: 0;
    background-clip: padding-box;
    overflow: hidden;
    min-height: 36px;
  }
  .swatch-btn:focus { outline: none; }
  .swatch-btn.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(196,110,77,.25), 0 2px 6px rgba(0,0,0,.12);
    transform: scale(1.05);
  }
  .swatch-btn .code {
    position: absolute;
    bottom: 2px; right: 3px;
    font-size: 55%;
    font-weight: 700;
    color: rgba(0,0,0,.75);
    text-shadow: 0 0 2px rgba(255,255,255,.7);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .swatch-btn.light .code { color: rgba(255,255,255,.95); text-shadow: 0 0 2px rgba(0,0,0,.4); }

  .controls { display: flex; flex-direction: column; gap: 6px; }
  .controls button {
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--ink);
    cursor: pointer;
    font-size: 13px;
    text-align: left;
    font-family: inherit;
    min-height: 40px;
  }
  .controls button:hover { background: #fff5ea; border-color: #e8c9a8; }
  .controls .toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink-2);
    padding: 8px 4px;
    cursor: pointer;
    min-height: 40px;
  }
  .controls .toggle input { accent-color: var(--accent); width: 18px; height: 18px; }
  .file-hint { font-size: 11px; color: #9b8a7a; padding: 4px; }

  .message {
    margin-top: 10px;
    padding: 8px 10px;
    background: #fff5ea;
    border: 1px dashed #e8c9a8;
    border-radius: 6px;
    font-size: 12px;
    color: var(--ink-2);
    min-height: 36px;
  }
  .message.success { background: #e9f4ed; border-color: #b8dac4; color: #2f6b46; }
  .message.warn { background: #fbeaea; border-color: #e0bcbc; color: #8a3a3a; }

  /* 庆祝 */
  #celebration { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
  .confetti {
    position: absolute;
    width: 10px; height: 14px;
    top: -20px;
    animation: fall 2.6s linear forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
  }
  #celebration-banner {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.5);
    background: rgba(255,255,255,.96);
    border: 2px solid var(--accent);
    padding: 24px 36px;
    border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,.2);
    z-index: 110;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  }
  #celebration-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #celebration-banner .big { font-size: 22px; font-weight: 700; color: var(--accent-2); margin: 0 0 8px; }
  #celebration-banner .sub { font-size: 14px; color: var(--ink-2); margin: 0 0 16px; }
  #celebration-banner button {
    padding: 8px 22px; border-radius: 8px;
    border: none; background: var(--accent); color: #fff;
    font-size: 14px; cursor: pointer; font-family: inherit;
  }
  #celebration-banner button:hover { background: var(--accent-2); }

  /* Lightbox 全屏查看 */
  #lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 200;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  #lightbox.show { display: flex; }
  #lightbox img {
    max-width: 92vw; max-height: 92vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  #lightbox .close-hint {
    position: absolute;
    top: 18px; right: 22px;
    color: rgba(255,255,255,.7);
    font-size: 13px;
    background: rgba(0,0,0,.4);
    padding: 6px 12px;
    border-radius: 6px;
    user-select: none;
  }

  /* ===== 响应式 =====
     桌面（width >= 981px）：三列，正常尺寸
     平板/移动横屏（width <= 980 且 landscape）：三列，紧凑
     平板竖屏（width <= 980 且 portrait）：单列堆叠
     小屏竖屏（width <= 480）：进一步压缩
     极小高度横屏（height <= 500）：进一步压缩（手机横屏） */

  /* 移动横屏：保留三列布局（紧凑尺寸，让画布尽量大） */
  @media (max-width: 980px) and (orientation: landscape) {
    main.layout {
      grid-template-columns: 220px 1fr 260px;
      padding: 8px;
      gap: 8px;
    }
    header.topbar { padding: 6px 12px; gap: 12px; }
    header.topbar h1 { font-size: 14px; }
    header.topbar h1 small { display: none; }
    header.topbar progress { width: 140px; height: 10px; }
    header.topbar .reset-btn { padding: 4px 10px; font-size: 11px; min-height: 28px; }
    header.topbar .prog-text { font-size: 11px; }
    .pane h2 { padding: 6px 10px; font-size: 12px; }
    .pane-body { padding: 10px; }
    .current-color { padding: 8px 10px; margin-bottom: 8px; }
    .current-color .swatch { width: 30px; height: 30px; }
    .current-color .info .name { font-size: 12px; }
    #palette { gap: 4px; }
    .swatch-btn { min-height: 30px; }
    .controls button { padding: 7px 10px; font-size: 12px; min-height: 32px; }
    .controls .toggle { padding: 5px 2px; min-height: 32px; font-size: 11px; }
    .ref-tabs .ref-tab { padding: 6px 8px; font-size: 11px; min-height: 30px; }
    .ref-hint { font-size: 10px; }
    .board-wrap { padding: 4px; }
    .file-hint { display: none; }
  }

  /* 手机横屏（高度 ≤ 500）：进一步压缩，最大化画布 */
  @media (max-height: 500px) and (orientation: landscape) {
    main.layout {
      grid-template-columns: 180px 1fr 220px;
      padding: 4px;
      gap: 6px;
    }
    header.topbar { padding: 4px 10px; gap: 10px; }
    header.topbar progress { width: 120px; }
    .pane h2 { padding: 4px 8px; font-size: 11px; }
    .pane-body { padding: 8px; }
    .current-color { padding: 6px 8px; }
    .current-color .swatch { width: 28px; height: 28px; }
    .swatch-btn { min-height: 28px; }
    .controls button { padding: 5px 8px; font-size: 11px; min-height: 28px; }
    .controls .toggle { min-height: 28px; }
    .ref-tabs .ref-tab { min-height: 28px; padding: 4px 6px; }
  }

  /* 移动竖屏：单列堆叠 */
  @media (max-width: 980px) and (orientation: portrait) {
    main.layout {
      grid-template-columns: 1fr;
      grid-template-areas: "ref" "board" "panel";
    }
    #ref-pane { grid-area: ref; }
    #board-pane { grid-area: board; }
    #side-pane { grid-area: panel; }
    .board-frame { max-width: 100%; }
  }

  /* 小屏竖屏（手机） */
  @media (max-width: 480px) {
    header.topbar { padding: 8px 12px; gap: 10px; }
    header.topbar h1 { font-size: 14px; }
    header.topbar h1 small { display: none; }
    header.topbar .progress { width: 100%; order: 1; margin-left: 0; }
    header.topbar progress { flex: 1; width: auto; }
    header.topbar .reset-btn { margin-left: 0; }
    main.layout { padding: 8px; gap: 8px; }
    .pane-body { padding: 10px; }
    #palette { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>🎨 诗织里 · 拼豆 <small>29×29 · 32 色 · v2.2</small></h1>
  <div class="progress">
    <span class="prog-text" id="prog-text">0 / 841 (0%)</span>
    <progress id="prog-bar" value="0" max="841"></progress>
    <button class="reset-btn" id="reset" title="清空全部格子">重置</button>
  </div>
</header>

<!-- 左上角浮动：撤销 -->
<div class="float-controls">
  <button class="float-btn" id="float-undo" title="撤销 (Ctrl+Z)" aria-label="撤销">↶</button>
</div>

<main class="layout">
  <!-- 参考图区 -->
  <section class="pane" id="ref-pane">
    <h2>参考图 <small>切换查看</small></h2>
    <div class="pane-body">
      <div class="ref-tabs">
        <button class="ref-tab active" data-tab="target">像素图纸</button>
        <button class="ref-tab" data-tab="original">原图参考</button>
      </div>
      <div class="ref-pane-frame" data-tab="target" id="target-frame">
        <canvas id="target-preview-canvas" width="580" height="580"></canvas>
        <canvas id="target-mask-canvas" width="580" height="580"></canvas>
      </div>
      <div class="ref-pane-frame" data-tab="original" id="original-frame" style="display:none">
        <img id="ref-image" alt="原图参考" />
      </div>
      <div class="ref-hint">点击图片可放大查看 · 图纸和画布对位</div>
    </div>
  </section>

  <!-- 画布区 -->
  <section class="pane" id="board-pane">
    <h2>画布 <small>左键放豆 · 右键擦除 · Ctrl+Z 撤销</small></h2>
    <div class="pane-body">
      <div class="board-wrap">
        <div class="board-frame">
          <div id="board-grid"></div>
        </div>
      </div>
      <div class="message" id="message">提示：先从右侧调色板选一个颜色，然后在画布格子上点一下放豆。</div>
    </div>
  </section>

  <!-- 侧栏 -->
  <aside class="pane" id="side-pane">
    <h2>调色板 &amp; 操作</h2>
    <div class="pane-body">
      <div class="current-color">
        <div class="swatch" id="cur-swatch"></div>
        <div class="info">
          <div class="name">当前颜色: <span id="cur-name">-</span></div>
          <div class="hex" id="cur-hex">#------</div>
        </div>
      </div>

      <div class="palette-section">
        <div class="palette-section-title">32 色（按亮度排序：1 最深 → 32 最浅）</div>
        <div id="palette"></div>
      </div>

      <div class="controls">
        <button id="undo">⏪ 撤销（Ctrl+Z）</button>
        <button id="redo">⏩ 重做（Ctrl+Y）</button>
        <button id="export-save">💾 导出进度（下载 JSON）</button>
        <button id="import-btn">📂 导入进度（从 JSON 恢复）</button>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none" />
        <div class="file-hint">localStorage 也会自动暂存进度，关闭浏览器再开会自动恢复。</div>

        <label class="toggle"><input type="checkbox" id="toggle-numbers" /> 画布显示色号</label>
        <label class="toggle"><input type="checkbox" id="toggle-mumbers-target" /> 图纸显示色号</label>
        <label class="toggle"><input type="checkbox" id="toggle-mask" checked /> 图纸已放遮罩</label>
        <label class="toggle"><input type="checkbox" id="toggle-mistakes" /> 标记对错（绿=对 / 红=错）</label>

        <button id="export-png">📷 导出完成图（PNG）</button>
      </div>
    </div>
  </aside>
</main>

<!-- 全屏查看 -->
<div id="lightbox">
  <span class="close-hint">点击空白 / 按 ESC 关闭</span>
  <img alt="放大查看" />
</div>

<!-- 庆祝 -->
<div id="celebration"></div>
<div id="celebration-banner">
  <p class="big">🎉 拼完啦！</p>
  <p class="sub">29×29，841 块豆全部就位</p>
  <button id="celebrate-close">继续欣赏</button>
</div>

<script>
(function(){
  // ============ 数据 ============
  let GRID_DATA;
  try { GRID_DATA = JSON.parse(document.getElementById('grid-data').textContent); }
  catch(e){ console.error('数据加载失败', e); return; }

  const N = GRID_DATA.size;
  const PALETTE = GRID_DATA.palette;
  const TARGET = GRID_DATA.grid;
  const TOTAL = N * N;
  const SCALE = 20; // 图纸 canvas 内部倍率
  const STORAGE_KEY = '拼豆_诗织里_v1';
  const VERSION = 2;

  // 状态
  let cells; let selectedIdx;
  let undoStack = []; let redoStack = [];
  let showNumbers = false;
  let showNumbersOnTarget = false;
  let showMaskOnTarget = true;
  let showMistakes = false;
  let finished = false;

  const $ = id => document.getElementById(id);

  // 工具
  function rgbToCss([r,g,b]) { return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }
  function isLight(rgb) { const [r,g,b] = rgb; return (0.299*r + 0.587*g + 0.114*b) > 145; }

  // 持久化
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: VERSION,
        cells, selectedIdx,
        showNumbers, showNumbersOnTarget, showMaskOnTarget, showMistakes, finished
      }));
    } catch(e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (d.version !== VERSION) return false;
      cells = d.cells;
      selectedIdx = d.selectedIdx || 0;
      showNumbers = !!d.showNumbers;
      showNumbersOnTarget = !!d.showNumbersOnTarget;
      showMaskOnTarget = d.showMaskOnTarget !== false;
      showMistakes = !!d.showMistakes;
      finished = !!d.finished;
      return true;
    } catch(e) { return false; }
  }
  function freshState() {
    cells = Array.from({length:N}, () => Array(N).fill(-1));
    selectedIdx = 0;
    undoStack = []; redoStack = []; finished = false;
  }
  function snapshot() { return cells.map(row => row.slice()); }
  function applySnapshot(s) { cells = s.map(row => row.slice()); }

  // ============ 渲染 ============
  function renderPalette() {
    const el = $('palette'); el.innerHTML = '';
    for (let i = 0; i < PALETTE.length; i++) {
      const rgb = PALETTE[i];
      const btn = document.createElement('button');
      btn.className = 'swatch-btn' + (isLight(rgb) ? ' light' : '');
      btn.style.background = rgbToCss(rgb);
      btn.dataset.idx = i;
      btn.title = `${i+1} · ${rgbToCss(rgb)}`;
      const c = document.createElement('span');
      c.className = 'code';
      c.textContent = i+1;
      btn.appendChild(c);
      btn.addEventListener('click', () => selectColor(i));
      el.appendChild(btn);
    }
  }

  function selectColor(i) {
    selectedIdx = i;
    document.querySelectorAll('.swatch-btn').forEach(b => {
      b.classList.toggle('selected', parseInt(b.dataset.idx,10) === i);
    });
    const rgb = PALETTE[i];
    $('cur-swatch').style.background = rgbToCss(rgb);
    $('cur-name').textContent = (i+1) + ' 号';
    $('cur-hex').textContent = rgbToCss(rgb) + '  ·  ' + PALETTE.length + ' 色';
    save();
  }

  let cellEls = [];

  function renderBoard() {
    const grid = $('board-grid'); grid.innerHTML = '';
    cellEls = [];
    for (let r = 0; r < N; r++) {
      const row = [];
      for (let c = 0; c < N; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if ((c+1) % 5 === 0) cell.classList.add('right-edge');
        if ((r+1) % 5 === 0) cell.classList.add('bottom-edge');
        cell.dataset.r = r; cell.dataset.c = c;
        const num = document.createElement('span');
        num.className = 'num'; num.textContent = TARGET[r][c] + 1;
        cell.appendChild(num);
        grid.appendChild(cell);
        row.push(cell);
      }
      cellEls.push(row);
    }
    // 委托事件
    grid.addEventListener('mousedown', onCellMouseDown);
    grid.addEventListener('mouseover', onGridMouseOver);
    grid.addEventListener('mouseout', onGridMouseOut);
    grid.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('mouseup', () => { dragging = false; dragMode = null; });
  }

  function renderCell(r, c) {
    const cell = cellEls[r][c];
    const idx = cells[r][c];
    cell.classList.toggle('placed', idx !== -1);
    cell.classList.toggle('show-num', showNumbers);
    if (idx === -1) {
      cell.style.background = '';
    } else {
      cell.style.background = rgbToCss(PALETTE[idx]);
    }
    if (showMistakes && idx !== -1) {
      cell.classList.toggle('correct', idx === TARGET[r][c]);
      cell.classList.toggle('wrong', idx !== TARGET[r][c]);
    } else {
      cell.classList.remove('correct'); cell.classList.remove('wrong');
    }
  }

  function renderAll() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) renderCell(r,c);
    renderStatus();
    renderTarget();
    save();
  }

  // 高分辨率图纸（修复马赛克）
  function renderTarget() {
    const c = $('target-preview-canvas');
    c.width = N * SCALE; c.height = N * SCALE;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    for (let r = 0; r < N; r++) {
      for (let col = 0; col < N; col++) {
        const idx = TARGET[r][col];
        const [rr,gg,bb] = PALETTE[idx];
        ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
        ctx.fillRect(col*SCALE, r*SCALE, SCALE, SCALE);
      }
    }
    // 格子线
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      ctx.beginPath();
      ctx.moveTo(i*SCALE + 0.5, 0); ctx.lineTo(i*SCALE + 0.5, N*SCALE);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i*SCALE + 0.5); ctx.lineTo(N*SCALE, i*SCALE + 0.5);
      ctx.stroke();
    }
    // 色号文字
    if (showNumbersOnTarget) {
      ctx.font = `bold ${Math.round(SCALE*0.55)}px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let r = 0; r < N; r++) {
        for (let col = 0; col < N; col++) {
          const idx = TARGET[r][col];
          const rgb = PALETTE[idx];
          ctx.fillStyle = isLight(rgb) ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.95)';
          ctx.fillText(String(idx+1), col*SCALE + SCALE/2, r*SCALE + SCALE/2);
        }
      }
    }
    renderMask();
  }

  function renderMask() {
    const c = $('target-mask-canvas');
    c.width = N * SCALE; c.height = N * SCALE;
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,N*SCALE,N*SCALE);
    c.classList.toggle('on', showMaskOnTarget);
    if (!showMaskOnTarget) return;
    for (let r = 0; r < N; r++) {
      for (let col = 0; col < N; col++) {
        if (cells[r][col] !== -1) {
          ctx.fillStyle = cells[r][col] === TARGET[r][col]
            ? 'rgba(255,255,255,0.55)'
            : 'rgba(196,110,77,0.5)';
          ctx.fillRect(col*SCALE, r*SCALE, SCALE, SCALE);
        }
      }
    }
  }

  function renderStatus() {
    let match = 0, placed = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (cells[r][c] !== -1) { placed++; if (cells[r][c] === TARGET[r][c]) match++; }
    }
    $('prog-text').textContent = `${match} / ${TOTAL} (${(match/TOTAL*100).toFixed(1)}%) · 已放 ${placed}`;
    $('prog-bar').value = match;
    return { match, placed };
  }

  // ============ 操作 ============
  let dragging = false, dragMode = null;

  function onCellMouseDown(e) {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const r = +cell.dataset.r, c = +cell.dataset.c;
    if (e.button === 2) { dragMode = 'erase'; placeAt(r,c,true); }
    else { dragMode = 'place'; placeAt(r,c,false); }
    dragging = true;
    e.preventDefault();
  }
  function onGridMouseOver(e) {
    const cell = e.target.closest('.cell');
    if (cell) cell.classList.add('preview');
    if (!dragging) return;
    if (!cell) return;
    const r = +cell.dataset.r, c = +cell.dataset.c;
    if (dragMode === 'erase') placeAt(r,c,true);
    else placeAt(r,c,false);
  }
  function onGridMouseOut(e) {
    const cell = e.target.closest('.cell');
    if (cell) cell.classList.remove('preview');
  }

  function placeAt(r, c, asErase) {
    if (finished) return;
    const before = snapshot();
    if (asErase) {
      if (cells[r][c] === -1) return;
      cells[r][c] = -1;
    } else {
      if (cells[r][c] === selectedIdx) return;
      cells[r][c] = selectedIdx;
    }
    undoStack.push(before);
    if (undoStack.length > 500) undoStack.shift();
    redoStack = [];
    renderCell(r,c);
    renderStatus();
    renderMask();
    save();
    checkComplete();
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    applySnapshot(undoStack.pop());
    renderAll();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    applySnapshot(redoStack.pop());
    renderAll();
  }
  function reset() {
    if (!confirm('确认重置全部格子？此操作可撤销。')) return;
    undoStack.push(snapshot());
    if (undoStack.length > 500) undoStack.shift();
    redoStack = [];
    cells = Array.from({length:N}, () => Array(N).fill(-1));
    finished = false;
    renderAll();
    flashMsg('画布已重置，按撤销可恢复', 'warn');
  }

  function checkComplete() {
    const { match, placed } = renderStatus();
    if (match === TOTAL && !finished) {
      finished = true;
      celebrate();
    }
  }

  function flashMsg(text, type='info') {
    const m = $('message');
    m.textContent = text;
    m.className = 'message' + (type !== 'info' ? ' ' + type : '');
  }

  function celebrate() {
    $('celebration-banner').classList.add('show');
    const layer = $('celebration');
    for (let i = 0; i < 80; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = `hsl(${Math.random()*360}, 70%, 60%)`;
      piece.style.animationDelay = (Math.random() * 0.6) + 's';
      piece.style.transform = `rotate(${Math.random()*360}deg)`;
      layer.appendChild(piece);
      setTimeout(() => piece.remove(), 3000);
    }
    flashMsg('🎉 完成了！29×29 全部对齐。', 'success');
  }

  // ============ 导出 / 导入 进度 ============
  function pad2(n) { return String(n).padStart(2,'0'); }
  function ts() {
    const d = new Date();
    return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
  }

  function exportSave() {
    const { match, placed } = renderStatus();
    const data = {
      version: VERSION,
      savedAt: new Date().toISOString(),
      appName: 'pixbeads-shizhili',
      size: N,
      palette: PALETTE,
      grid: TARGET,
      cells, selectedIdx,
      showNumbers, showNumbersOnTarget, showMaskOnTarget, showMistakes,
      finished,
      stats: { match, placed, total: TOTAL }
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `拼豆_诗织里_进度_${ts()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    flashMsg(`已导出进度：${match}/${TOTAL} 块对齐，${placed} 块已放`, 'success');
  }

  function importSave(file) {
    const reader = new FileReader();
    reader.onload = e => {
      let d;
      try { d = JSON.parse(e.target.result); }
      catch(err) { alert('进度文件解析失败：不是有效的 JSON'); return; }
      if (!d || typeof d !== 'object') { alert('进度文件格式不正确'); return; }
      if (d.size !== N) { alert(`尺寸不匹配：文件是 ${d.size}×${d.size}，当前游戏是 ${N}×${N}`); return; }
      if (!Array.isArray(d.cells) || d.cells.length !== N) { alert('cells 数据损坏'); return; }
      if (!confirm(`将覆盖当前进度（${d.stats?.match ?? '?'}/${TOTAL} 块对齐）。确认导入？`)) return;
      cells = d.cells.map(row => row.slice());
      selectedIdx = Math.max(0, Math.min(PALETTE.length-1, d.selectedIdx || 0));
      showNumbers = !!d.showNumbers;
      showNumbersOnTarget = !!d.showNumbersOnTarget;
      showMaskOnTarget = d.showMaskOnTarget !== false;
      showMistakes = !!d.showMistakes;
      finished = !!d.finished;
      undoStack = []; redoStack = [];
      $('toggle-numbers').checked = showNumbers;
      $('toggle-mumbers-target').checked = showNumbersOnTarget;
      $('toggle-mask').checked = showMaskOnTarget;
      $('toggle-mistakes').checked = showMistakes;
      renderAll();
      selectColor(selectedIdx);
      flashMsg('已导入进度', 'success');
    };
    reader.onerror = () => alert('文件读取失败');
    reader.readAsText(file);
  }

  // ============ Tab 切换 ============
  function switchTab(name) {
    document.querySelectorAll('.ref-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === name);
    });
    document.querySelectorAll('.ref-pane-frame').forEach(p => {
      p.style.display = (p.dataset.tab === name ? '' : 'none');
    });
    if (name === 'target') renderTarget();
  }

  // ============ Lightbox ============
  function openLightbox(src) {
    const lb = $('lightbox');
    lb.querySelector('img').src = src;
    lb.classList.add('show');
  }
  function closeLightbox() {
    $('lightbox').classList.remove('show');
    $('lightbox').querySelector('img').src = '';
  }

  // ============ 导出 PNG ============
  function exportPNG() {
    const c = document.createElement('canvas');
    c.width = N * 8; c.height = N * 8;
    const ctx = c.getContext('2d');
    for (let r = 0; r < N; r++) {
      for (let col = 0; col < N; col++) {
        const idx = cells[r][col];
        if (idx === -1) {
          ctx.fillStyle = '#f0e9dc';
        } else {
          const [rr,gg,bb] = PALETTE[idx];
          ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
        }
        ctx.fillRect(col*8, r*8, 8, 8);
      }
    }
    const url = c.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = `拼豆_诗织里_${N}x${N}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    flashMsg('已导出完成图（PNG）', 'success');
  }

  // ============ 启动 ============
  function init() {
    if (!load()) freshState();

    $('toggle-numbers').checked = showNumbers;
    $('toggle-mumbers-target').checked = showNumbersOnTarget;
    $('toggle-mask').checked = showMaskOnTarget;
    $('toggle-mistakes').checked = showMistakes;

    renderPalette();
    renderBoard();
    renderTarget();
    selectColor(selectedIdx);

    // 操作
    $('undo').addEventListener('click', undo);
    const floatUndo = document.getElementById('float-undo');
    if (floatUndo) floatUndo.addEventListener('click', undo);
    $('redo').addEventListener('click', redo);
    $('reset').addEventListener('click', reset);
    $('export-save').addEventListener('click', exportSave);
    $('export-png').addEventListener('click', exportPNG);
    $('import-btn').addEventListener('click', () => $('import-file').click());
    $('import-file').addEventListener('change', e => {
      const f = e.target.files[0];
      if (f) importSave(f);
      e.target.value = '';
    });
    $('celebrate-close').addEventListener('click', () => $('celebration-banner').classList.remove('show'));

    $('toggle-numbers').addEventListener('change', e => {
      showNumbers = e.target.checked;
      document.querySelectorAll('.cell').forEach(el => el.classList.toggle('show-num', showNumbers));
      save();
    });
    $('toggle-mumbers-target').addEventListener('change', e => {
      showNumbersOnTarget = e.target.checked;
      renderTarget();
      save();
    });
    $('toggle-mask').addEventListener('change', e => {
      showMaskOnTarget = e.target.checked;
      $('target-mask-canvas').classList.toggle('on', showMaskOnTarget);
      renderMask();
      save();
    });
    $('toggle-mistakes').addEventListener('change', e => {
      showMistakes = e.target.checked;
      renderAll();
      save();
    });

    // Tab
    document.querySelectorAll('.ref-tab').forEach(b => {
      b.addEventListener('click', () => switchTab(b.dataset.tab));
    });

    // Lightbox
    $('ref-image').addEventListener('click', () => openLightbox($('ref-image').src));
    $('target-frame').addEventListener('click', () => {
      const c = document.createElement('canvas');
      c.width = N * SCALE; c.height = N * SCALE;
      const ctx = c.getContext('2d');
      ctx.drawImage($('target-preview-canvas'), 0, 0);
      if (showMaskOnTarget) ctx.drawImage($('target-mask-canvas'), 0, 0);
      openLightbox(c.toDataURL('image/png'));
    });
    $('lightbox').addEventListener('click', closeLightbox);

    // 键盘
    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault(); redo();
      } else if (e.key === 'Escape') {
        if ($('lightbox').classList.contains('show')) closeLightbox();
        else $('celebration-banner').classList.remove('show');
      } else if (/^[1-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey) {
        const n = parseInt(e.key,10);
        if (n <= PALETTE.length) selectColor(n-1);
      }
    });

    // resize 重画
    let resizeT = null;
    window.addEventListener('resize', () => {
      if (resizeT) clearTimeout(resizeT);
      resizeT = setTimeout(renderTarget, 150);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

</body>
</html>
